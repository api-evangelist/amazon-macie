name: Amazon Macie
description: >-
  Amazon Macie is a data security service that discovers sensitive data by
  using machine learning and pattern matching, provides visibility into data
  security risks, and enables automated protection against those risks.
  Macie automates the discovery of sensitive data, such as personally
  identifiable information (PII) and financial data, to provide you with a
  better understanding of the data that your organization stores in Amazon
  S3. Macie also provides you with an inventory of your S3 buckets and
  automatically evaluates and monitors those buckets for security and
  access control.
