aid: amazon-macie
name: Amazon Macie
description: >-
  Amazon Macie is a data security service that discovers sensitive data by using machine learning and pattern matching,
  provides visibility into data security risks, and enables automated protection against those risks. Macie automates
  the discovery of sensitive data, such as personally identifiable information (PII) and financial data, to provide you
  with a better understanding of the data that your organization stores in Amazon S3.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/amazon-macie.png
tags:
