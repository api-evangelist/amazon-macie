    JobDetails:
      type: object
      properties:
        isDefinedInJob:
          allOf:
          - $ref: '#/components/schemas/IsDefinedInJob'
          - description: <p>Specifies whether any one-time or recurring jobs are configured to analyze data in the bucket. Possible values are:</p> <ul><li><p>TRUE - The bucket is explicitly included in the bucket definition (S3BucketDefinitionForJob) for one or more jobs and at least one of those jobs has a status other than CANCELLED. Or the bucket matched the bucket criteria (S3BucketCriteriaForJob) for at least one job that previously ran.</p></li> <li><p>FALSE - The bucket isn't explicitly included in the bucket definition (S3BucketDefinitionForJob) for any jobs, all the jobs that explicitly include the bucket in their bucket definitions have a status of CANCELLED, or the bucket didn't match the bucket criteria (S3BucketCriteriaForJob) for any jobs that previously ran.</p></li> <li><p>UNKNOWN - An exception occurred when Amazon Macie attempted to retrieve job data for the bucket.</p></li></ul>
        isMonitoredByJob:
          allOf:
          - $ref: '#/components/schemas/IsMonitoredByJob'
          - description: <p>Specifies whether any recurring jobs are configured to analyze data in the bucket. Possible values are:</p> <ul><li><p>TRUE - The bucket is explicitly included in the bucket definition (S3BucketDefinitionForJob) for one or more recurring jobs or the bucket matches the bucket criteria (S3BucketCriteriaForJob) for one or more recurring jobs. At least one of those jobs has a status other than CANCELLED.</p></li> <li><p>FALSE - The bucket isn't explicitly included in the bucket definition (S3BucketDefinitionForJob) for any recurring jobs, the bucket doesn't match the bucket criteria (S3BucketCriteriaForJob) for any recurring jobs, or all the recurring jobs that are configured to analyze data in the bucket have a status of CANCELLED.</p></li> <li><p>UNKNOWN - An exception occurred when Amazon Macie attempted to retrieve job data for the bucket.</p></li></ul>
        lastJobId:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: <p>The unique identifier for the job that ran most recently and is configured to analyze data in the bucket, either the latest run of a recurring job or the only run of a one-time job.</p> <p>This value is typically null if the value for the isDefinedInJob property is FALSE or UNKNOWN.</p>
        lastJobRunTime:
          allOf:
          - $ref: '#/components/schemas/__timestampIso8601'
          - description: <p>The date and time, in UTC and extended ISO 8601 format, when the job (lastJobId) started. If the job is a recurring job, this value indicates when the most recent run started.</p> <p>This value is typically null if the value for the isDefinedInJob property is FALSE or UNKNOWN.</p>
      description: Specifies whether any one-time or recurring classification jobs are configured to analyze data in an S3 bucket, and, if so, the details of the job that ran most recently.
    ObjectLevelStatistics:
      type: object
      properties:
        fileType:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The total storage size (in bytes) or number of objects that Amazon Macie can't analyze because the objects don't have a file name extension for a supported file or storage format.
        storageClass:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The total storage size (in bytes) or number of objects that Amazon Macie can't analyze because the objects use an unsupported storage class.
        total:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The total storage size (in bytes) or number of objects that Amazon Macie can't analyze because the objects use an unsupported storage class or don't have a file name extension for a supported file or storage format.
      description: Provides information about the total storage size (in bytes) or number of objects that Amazon Macie can't analyze in one or more S3 buckets. In a BucketMetadata or MatchingBucket object, this data is for a specific bucket. In a GetBucketStatisticsResponse object, this data is aggregated for all the buckets in the query results. If versioning is enabled for a bucket, storage size values are based on the size of the latest version of each applicable object in the bucket.
    BucketPermissionConfiguration:
      type: object
      properties:
        accountLevelPermissions:
          allOf:
          - $ref: '#/components/schemas/AccountLevelPermissions'
          - description: The account-level permissions settings that apply to the bucket.
        bucketLevelPermissions:
          allOf:
          - $ref: '#/components/schemas/BucketLevelPermissions'
          - description: The bucket-level permissions settings for the bucket.
      description: Provides information about the account-level and bucket-level permissions settings for an S3 bucket.
    KeyValuePair:
      type: object
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: One part of a key-value pair that comprises a tag. A tag key is a general label that acts as a category for more specific tag values.
        value:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: One part of a key-value pair that comprises a tag. A tag value acts as a descriptor for a tag key. A tag value can be an empty string.
      description: Provides information about the tags that are associated with an S3 bucket or object. Each tag consists of a required tag key and an associated tag value.
    AccountLevelPermissions:
      type: object
      properties:
        blockPublicAccess:
          allOf:
          - $ref: '#/components/schemas/BlockPublicAccess'
          - description: The block public access settings for the Amazon Web Services account that owns the bucket.
      description: Provides information about the account-level permissions settings that apply to an S3 bucket.
    BlockPublicAccess:
      type: object
      properties:
        blockPublicAcls:
          allOf:
          - $ref: '#/components/schemas/__boolean'
          - description: Specifies whether Amazon S3 blocks public access control lists (ACLs) for the bucket and objects in the bucket.
        blockPublicPolicy:
          allOf:
          - $ref: '#/components/schemas/__boolean'
          - description: Specifies whether Amazon S3 blocks public bucket policies for the bucket.
        ignorePublicAcls:
          allOf:
          - $ref: '#/components/schemas/__boolean'
          - description: Specifies whether Amazon S3 ignores public ACLs for the bucket and objects in the bucket.
        restrictPublicBuckets:
          allOf:
          - $ref: '#/components/schemas/__boolean'
          - description: Specifies whether Amazon S3 restricts public bucket policies for the bucket.
      description: Provides information about the block public access settings for an S3 bucket. These settings can apply to a bucket at the account or bucket level. For detailed information about each setting, see <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html">Blocking public access to your Amazon S3 storage</a> in the <i>Amazon Simple Storage Service User Guide</i>.
