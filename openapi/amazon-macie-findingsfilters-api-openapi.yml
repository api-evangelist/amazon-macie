components:
  schemas:
    ConflictException: {}
    ListFindingsFiltersResponse:
      type: object
      properties:
        findingsFilterListItems:
          allOf:
          - $ref: '#/components/schemas/__listOfFindingsFilterListItem'
          - description: An array of objects, one for each filter that's associated with the account.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The string to use in a subsequent request to get the next page of results in a paginated response. This value is null if there are no additional pages.
    ResourceNotFoundException: {}
    __integer:
      type: integer
    ValidationException: {}
    Criterion:
      type: object
      description: Specifies a condition that defines a property, operator, and one or more values to filter the results of a query for findings. The number of values depends on the property and operator specified by the condition. For information about defining filter conditions, see <a href="https://docs.aws.amazon.com/macie/latest/user/findings-filter-basics.html">Fundamentals of filtering findings</a> in the <i>Amazon Macie User Guide</i>.
      additionalProperties:
        $ref: '#/components/schemas/CriterionAdditionalProperties'
    AccessDeniedException: {}
    UpdateFindingsFilterResponse:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The Amazon Resource Name (ARN) of the filter that was updated.
        id:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The unique identifier for the filter that was updated.
    TagMap:
      type: object
      description: A string-to-string map of key-value pairs that specifies the tags (keys and values) for an Amazon Macie resource.
      additionalProperties:
        $ref: '#/components/schemas/__string'
    __listOfFindingsFilterListItem:
      type: array
      items:
        $ref: '#/components/schemas/FindingsFilterListItem'
    DeleteFindingsFilterResponse:
      type: object
      properties: {}
    InternalServerException: {}
    FindingsFilterAction:
      type: string
      enum:
      - ARCHIVE
      - NOOP
      description: 'The action to perform on findings that match the filter criteria. To suppress (automatically archive) findings that match the criteria, set this value to ARCHIVE. Valid values are:'
    FindingCriteria:
      type: object
      properties:
        criterion:
          allOf:
          - $ref: '#/components/schemas/Criterion'
          - description: A condition that specifies the property, operator, and one or more values to use to filter the results.
      description: Specifies, as a map, one or more property-based conditions that filter the results of a query for findings.
    FindingsFilterListItem:
      type: object
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/FindingsFilterAction'
          - description: 'The action that''s performed on findings that match the filter criteria. Possible values are: ARCHIVE, suppress (automatically archive) the findings; and, NOOP, don''t perform any action on the findings.'
        arn:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The Amazon Resource Name (ARN) of the filter.
        id:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The unique identifier for the filter.
        name:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The custom name of the filter.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagMap'
          - description: A map of key-value pairs that specifies which tags (keys and values) are associated with the filter.
      description: Provides information about a findings filter.
    CreateFindingsFilterResponse:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The Amazon Resource Name (ARN) of the filter that was created.
        id:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The unique identifier for the filter that was created.
    __long:
      type: integer
    ServiceQuotaExceededException: {}
    GetFindingsFilterResponse:
      type: object
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/FindingsFilterAction'
          - description: 'The action that''s performed on findings that match the filter criteria (findingCriteria). Possible values are: ARCHIVE, suppress (automatically archive) the findings; and, NOOP, don''t perform any action on the findings.'
        arn:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The Amazon Resource Name (ARN) of the filter.
        description:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The custom description of the filter.
        findingCriteria:
          allOf:
          - $ref: '#/components/schemas/FindingCriteria'
          - description: The criteria that's used to filter findings.
        id:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The unique identifier for the filter.
        name:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The custom name of the filter.
        position:
          allOf:
          - $ref: '#/components/schemas/__integer'
          - description: The position of the filter in the list of saved filters on the Amazon Macie console. This value also determines the order in which the filter is applied to findings, relative to other filters that are also applied to the findings.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagMap'
          - description: A map of key-value pairs that specifies which tags (keys and values) are associated with the filter.
    CriterionAdditionalProperties:
      type: object
      properties:
        eq:
          allOf:
          - $ref: '#/components/schemas/__listOf__string'
          - description: The value for the property matches (equals) the specified value. If you specify multiple values, Macie uses OR logic to join the values.
        eqExactMatch:
          allOf:
          - $ref: '#/components/schemas/__listOf__string'
          - description: '<p>The value for the property exclusively matches (equals an exact match for) all the specified values. If you specify multiple values, Amazon Macie uses AND logic to join the values.</p> <p>You can use this operator with the following properties: customDataIdentifiers.detections.arn, customDataIdentifiers.detections.name, resourcesAffected.s3Bucket.tags.key, resourcesAffected.s3Bucket.tags.value, resourcesAffected.s3Object.tags.key, resourcesAffected.s3Object.tags.value, sensitiveData.category, and sensitiveData.detections.type.</p>'
        gt:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The value for the property is greater than the specified value.
        gte:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The value for the property is greater than or equal to the specified value.
        lt:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The value for the property is less than the specified value.
        lte:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The value for the property is less than or equal to the specified value.
        neq:
          allOf:
          - $ref: '#/components/schemas/__listOf__string'
          - description: The value for the property doesn't match (doesn't equal) the specified value. If you specify multiple values, Macie uses OR logic to join the values.
      description: Specifies the operator to use in a property-based condition that filters the results of a query for findings. For detailed information and examples of each operator, see <a href="https://docs.aws.amazon.com/macie/latest/user/findings-filter-basics.html">Fundamentals of filtering findings</a> in the <i>Amazon Macie User Guide</i>.
    __listOf__string:
      type: array
      items:
        $ref: '#/components/schemas/__string'
    __string:
      type: string
    ThrottlingException: {}
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
