components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    RelationshipStatus:
      type: string
      enum:
      - Enabled
      - Paused
      - Invited
      - Created
      - Removed
      - Resigned
      - EmailVerificationInProgress
      - EmailVerificationFailed
      - RegionDisabled
      - AccountSuspended
      description: 'The current status of the relationship between an account and an associated Amazon Macie administrator account. Possible values are:'
    InternalServerException: {}
    ThrottlingException: {}
    ErrorCode:
      type: string
      enum:
      - ClientError
      - InternalError
      description: 'The source of an issue or delay. Possible values are:'
    __listOfInvitation:
      type: array
      items:
        $ref: '#/components/schemas/Invitation'
    UnprocessedAccount:
      type: object
      properties:
        accountId:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The Amazon Web Services account ID for the account that the request applies to.
        errorCode:
          allOf:
          - $ref: '#/components/schemas/ErrorCode'
          - description: The source of the issue or delay in processing the request.
        errorMessage:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The reason why the request hasn't been processed.
      description: ' <p>Provides information about an account-related request that hasn''t been processed.</p>'
    Invitation:
      type: object
      properties:
        accountId:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The Amazon Web Services account ID for the account that sent the invitation.
        invitationId:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The unique identifier for the invitation.
        invitedAt:
          allOf:
          - $ref: '#/components/schemas/__timestampIso8601'
          - description: The date and time, in UTC and extended ISO 8601 format, when the invitation was sent.
        relationshipStatus:
          allOf:
          - $ref: '#/components/schemas/RelationshipStatus'
          - description: The status of the relationship between the account that sent the invitation and the account that received the invitation.
      description: Provides information about an Amazon Macie membership invitation.
    ConflictException: {}
    ListInvitationsResponse:
      type: object
      properties:
        invitations:
          allOf:
          - $ref: '#/components/schemas/__listOfInvitation'
          - description: An array of objects, one for each invitation that was received by the account.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/__string'
          - description: The string to use in a subsequent request to get the next page of results in a paginated response. This value is null if there are no additional pages.
    __string:
      type: string
    AcceptInvitationResponse:
      type: object
      properties: {}
    __long:
      type: integer
    ServiceQuotaExceededException: {}
    DeleteInvitationsResponse:
      type: object
      properties:
        unprocessedAccounts:
          allOf:
          - $ref: '#/components/schemas/__listOfUnprocessedAccount'
          - description: An array of objects, one for each account whose invitation hasn't been deleted. Each object identifies the account and explains why the request hasn't been processed for that account.
    CreateInvitationsResponse:
      type: object
      properties:
        unprocessedAccounts:
          allOf:
          - $ref: '#/components/schemas/__listOfUnprocessedAccount'
          - description: An array of objects, one for each account whose invitation hasn't been processed. Each object identifies the account and explains why the invitation hasn't been processed for the account.
    __timestampIso8601:
      type: string
      format: date-time
    DeclineInvitationsResponse:
      type: object
      properties:
        unprocessedAccounts:
          allOf:
          - $ref: '#/components/schemas/__listOfUnprocessedAccount'
          - description: An array of objects, one for each account whose invitation hasn't been declined. Each object identifies the account and explains why the request hasn't been processed for that account.
    ResourceNotFoundException: {}
    AccessDeniedException: {}
    __listOfUnprocessedAccount:
      type: array
      items:
        $ref: '#/components/schemas/UnprocessedAccount'
    GetInvitationsCountResponse:
      type: object
      properties:
        invitationsCount:
          allOf:
          - $ref: '#/components/schemas/__long'
          - description: The total number of invitations that were received by the account, not including the currently accepted invitation.
    ValidationException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
