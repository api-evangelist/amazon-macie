naftiko: 1.0.0-alpha2
info:
  label: Amazon Macie - Data Security Operations
  description: Workflow capability for security and compliance teams to discover sensitive data, investigate findings, and
    manage data security posture in Amazon S3 using Amazon Macie.
  tags:
  - Amazon
  - Data Security
  - Sensitive Data
  - Privacy
  - Compliance
  - S3
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: macie
    baseUri: https://macie2.amazonaws.com
    description: Amazon Macie 2 REST API
    authentication:
      type: apikey
      key: Authorization
      value: AWS4-HMAC-SHA256 {{AWS_ACCESS_KEY_ID}}
      placement: header
    resources:
    - name: findings
      path: /findings
      description: Manage sensitive data findings
      operations:
      - name: list-findings
        method: GET
        description: List findings for the account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-findings
        method: POST
        description: Get details for specific findings
        inputParameters:
        - name: findingIds
          in: body
          type: array
          required: true
          description: List of finding IDs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: classification-jobs
      path: /jobs
      description: Manage sensitive data discovery jobs
      operations:
      - name: create-classification-job
        method: POST
        description: Create a sensitive data discovery job
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Job configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-classification-jobs
        method: GET
        description: List classification jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-classification-job
        method: GET
        description: Get details of a classification job
        inputParameters:
        - name: jobId
          in: path
          type: string
          required: true
          description: Job ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: buckets
      path: /datasources/s3
      description: Manage monitored S3 buckets
      operations:
      - name: describe-buckets
        method: POST
        description: Get details of monitored S3 buckets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: custom-data-identifiers
      path: /custom-data-identifiers
      description: Manage custom sensitive data identifiers
      operations:
      - name: create-custom-data-identifier
        method: POST
        description: Create a custom data identifier
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Custom identifier configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-custom-data-identifiers
        method: GET
        description: List custom data identifiers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: data-security-api
    description: Unified REST API for Amazon Macie data security operations.
    resources:
    - path: /v1/findings
      name: findings
      description: Sensitive data findings
      operations:
      - method: GET
        name: list-findings
        description: List sensitive data findings
        call: macie.list-findings
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: get-findings
        description: Get finding details
        call: macie.get-findings
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs
      name: jobs
      description: Data discovery jobs
      operations:
      - method: POST
        name: create-job
        description: Create a data discovery job
        call: macie.create-classification-job
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-jobs
        description: List all discovery jobs
        call: macie.list-classification-jobs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buckets
      name: buckets
      description: Monitored S3 buckets
      operations:
      - method: GET
        name: describe-buckets
        description: Get bucket security details
        call: macie.describe-buckets
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/identifiers
      name: identifiers
      description: Custom data identifiers
      operations:
      - method: POST
        name: create-identifier
        description: Create custom data identifier
        call: macie.create-custom-data-identifier
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-identifiers
        description: List custom identifiers
        call: macie.list-custom-data-identifiers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: data-security-mcp
    transport: http
    description: MCP server for AI-assisted data security operations with Amazon Macie.
    tools:
    - name: list-sensitive-data-findings
      description: List all sensitive data findings detected by Macie
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: macie.list-findings
      outputParameters:
      - type: object
        mapping: $.
    - name: get-finding-details
      description: Get detailed information about specific sensitive data findings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: macie.get-findings
      outputParameters:
      - type: object
        mapping: $.
    - name: create-discovery-job
      description: Create a job to discover sensitive data in S3 buckets
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: macie.create-classification-job
      outputParameters:
      - type: object
        mapping: $.
    - name: list-discovery-jobs
      description: List all sensitive data discovery jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: macie.list-classification-jobs
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bucket-security-posture
      description: Get security details and sensitive data statistics for monitored S3 buckets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: macie.describe-buckets
      outputParameters:
      - type: object
        mapping: $.
    - name: create-custom-data-identifier
      description: Create a custom pattern to detect organization-specific sensitive data types
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: macie.create-custom-data-identifier
      outputParameters:
      - type: object
        mapping: $.
    - name: list-custom-identifiers
      description: List all custom sensitive data identifiers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: macie.list-custom-data-identifiers
      outputParameters:
      - type: object
        mapping: $.
